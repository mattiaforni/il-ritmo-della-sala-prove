<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Il ritmo della sala prove</title>
<meta name="description" content="Scaletta, task, registrazioni e cassa della band">
<meta name="theme-color" content="#ECE7DF">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- testata: nome della sezione e una riga di contesto (scritte da testata() in app.js) -->
<header class="topbar">
  <div class="topbar-row">
    <img class="logo-img" src="icons/icon-192.png" alt="">
    <div class="tb-testo">
      <h1 class="logo" id="tb-titolo">Il ritmo della sala prove</h1>
      <p class="tb-sub" id="tb-sub"></p>
    </div>
    <button id="user-chip" class="user-chip hidden" title="Cambia nome">—</button>
  </div>
</header>

<main>
  <section id="view-scaletta" class="view active"></section>
  <section id="view-proposte" class="view"></section>
  <section id="view-audio" class="view"></section>
  <section id="view-bacheca" class="view"></section>
  <section id="view-cassa" class="view"></section>
  <section id="view-personale" class="view"></section>
</main>

<!-- riproduzione in corso: sopra la barra delle sezioni, visibile in tutte le sezioni -->
<div id="mini" class="mini hidden" role="region" aria-label="In riproduzione"></div>
<div id="lettore" class="lettore hidden" role="dialog" aria-label="In riproduzione"></div>

<!-- barra delle sezioni, fissa in basso -->
<nav class="bnav tabs" aria-label="Sezioni">
  <button class="tab active" data-tab="scaletta"><svg aria-hidden="true"><use href="#i-scaletta"/></svg><span>Scaletta</span></button>
  <button class="tab" data-tab="proposte"><svg aria-hidden="true"><use href="#i-proposte"/></svg><span>Proposte</span></button>
  <button class="tab" data-tab="audio"><svg aria-hidden="true"><use href="#i-audio"/></svg><span>Audio</span></button>
  <button class="tab" data-tab="bacheca"><svg aria-hidden="true"><use href="#i-bacheca"/></svg><span>Bacheca</span></button>
  <button class="tab" data-tab="cassa"><svg aria-hidden="true"><use href="#i-cassa"/></svg><span>Cassa</span></button>
  <button class="tab" data-tab="personale"><span id="nav-me" class="me-ico">—</span><span>Personale</span></button>
</nav>

<!-- accesso: la band con la sua password; i fan con nome e password da fan (o con il link d'invito, che contiene la password) -->
<div id="gate" class="gate hidden">
  <div class="gate-corpo">
    <img src="icons/icon-192.png" alt="">
    <h2>Il ritmo della sala prove</h2>
    <div class="gate-seg" role="group" aria-label="Chi sei">
      <button type="button" data-modo="band" aria-pressed="true">Band</button>
      <button type="button" data-modo="fan" aria-pressed="false">Fan</button>
    </div>
    <p id="gate-nota" class="gate-nota"></p>
    <form id="gate-form" autocomplete="on">
      <input type="text" id="gate-user" name="username" value="band" autocomplete="username" hidden>
      <div class="pw-row gate-nome hidden"><input id="gate-nome" type="text" placeholder="Il tuo nome" maxlength="30" autocomplete="given-name" autocapitalize="words"></div>
      <div class="pw-row gate-pw-row">
        <input id="gate-pw" type="password" name="password" placeholder="Password della band" autocomplete="current-password">
        <button type="button" id="gate-show">mostra</button>
      </div>
      <label class="gate-check hidden"><input type="checkbox" id="gate-notifiche" checked><span>Avvisami di registrazioni nuove e diretta</span></label>
      <p id="gate-err" class="err" role="alert"></p>
      <div class="gate-piede"><button class="enter" type="submit">Entra</button></div>
    </form>
  </div>
</div>

<!-- scelta del nome con cui firmare -->
<div id="overlay" class="overlay hidden">
  <div class="overlay-card">
    <h2 class="overlay-title">Chi sei?</h2>
    <p class="overlay-sub">Il nome con cui firmi task, voti, spese e appunti di setup.</p>
    <div id="member-picker" class="member-picker"></div>
    <form id="new-member-form" class="inline-form">
      <input id="new-member-name" class="field" type="text" placeholder="…o aggiungi il tuo nome" maxlength="30" autocomplete="off">
      <button type="submit" class="btn fill">Entra</button>
    </form>
  </div>
</div>

<!-- fan: nome (se manca) e pannello dal nome in alto: notifiche, cambia nome, esci -->
<div id="fan-box" class="overlay fan-box hidden">
  <div class="overlay-card fan-card" id="fan-card"></div>
</div>

<div id="setup-notice" class="setup-notice hidden">
  <h2>Manca la configurazione Firebase</h2>
  <p>Apri <code>config.js</code> e incolla i valori del tuo progetto Firebase, poi pubblica di nuovo.</p>
</div>

<div id="update-banner" class="update-banner hidden" role="status"><span>È disponibile una versione nuova dell'app.</span><button type="button" id="update-btn">Aggiorna</button></div>
<div id="conn-banner" class="conn-banner hidden" role="alert"><span></span><button type="button" onclick="location.reload()">Ricarica</button></div>
<div id="toast" class="toast hidden"></div>
<audio id="player" preload="metadata"></audio>
<!-- secondo lettore: carica in anticipo la registrazione successiva della coda, poi i due si danno il cambio -->
<audio id="player2" preload="auto"></audio>
<audio id="diretta-audio" autoplay playsinline></audio>

</html>
